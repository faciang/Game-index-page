<script>const SOURCES={procedure:{name:'民事訴訟法第277、279條',url:'https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0010001'},loan:{name:'臺北地院113年度訴字第3600號（援引最高法院109台上711、98台上1045）',url:'https://judgment.judicial.gov.tw/FJUD/printData.aspx?id=TPDV%2C113%2C%E8%A8%B4%2C3600%2C20251210%2C1'},pay:{name:'臺灣高等法院110年度上字第70號（援引最高法院109台上1329）',url:'https://judgment.judicial.gov.tw/FJUD/printData.aspx?id=TPHV%2C110%2C%E4%B8%8A%2C70%2C20220104%2C2'},land:{name:'新北地院113年度訴字第1599號',url:'https://judgment.judicial.gov.tw/FJUD/printData.aspx?id=PCDV%2C113%2C%E8%A8%B4%2C1599%2C20250529%2C1'},tort:{name:'臺灣高等法院110年度上易字第335號（援引最高法院100台上328）',url:'https://judgment.judicial.gov.tw/FJUD/printData.aspx?id=TPHV%2C110%2C%E4%B8%8A%E6%98%93%2C335%2C20220830%2C1'},civil:{name:'民法第309、343、345、367、474、767條等',url:'https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0000001'}};
// truth: U=調查後仍不明、T=證明／自認。support 表示該事實在玩家推論中有利的一方。
const fact=(text,truth,support,evidence)=>({text,truth,support,evidence});
const CASES=[
{title:'匯款的另一種意思',tag:'借款・成立',p:'我匯了10萬元借給他，約定上個月還，請求返還借款。',d:'錢有收到，但那是你送我的，根本沒有說要借。',base:'原告僅依消費借貸請求。收款不爭執；不涉及票據、其他請求權或舉證責任調整。',issues:['借貸合意是否存在','被告是否已清償借款','被告是否有還款能力'],facts:[fact('雙方約定這筆錢要返還','U','P','匯款紀錄只能確認交付；對話只有「錢收到了」。調查所有證據後，仍無法確認借貸合意。'),fact('原告曾匯款10萬元','T','P','銀行紀錄與被告陳述均確認收款，但交付原因仍有爭執。'),fact('被告收入足以還款','U','P','卷內沒有被告收入資料；收入也不是借貸成立要件。')],burden:'P',winner:'D',reason:'原告須證明借貸合意與交付。收款已無爭執，但借貸合意仍不明，原告應承擔不利益；不能因被告證明不了贈與，就反推借貸成立。',sources:['loan','procedure']},
{title:'借到了，還是沒拿到？',tag:'借款・交付',p:'他答應借5萬元，我也給了，現在到期請他還。',d:'是談好要借，但你從來沒把錢交給我。',base:'借貸合意不爭執。原告主張現金交付，請求返還5萬元，無其他請求基礎。',issues:['借款是否實際交付','借款是否已經清償','借款人是否有工作'],facts:[fact('原告已將5萬元交給被告','U','P','原告只提出自己的提款紀錄；沒有收款文字或其他補強。綜合調查後，交付仍真偽不明。'),fact('雙方曾談妥借款5萬元','T','P','雙方均承認借款約定，但談妥不代表金錢已交付。'),fact('原告曾領出5萬元','T','P','提款紀錄為真，但領款不當然等於交給被告。')],burden:'P',winner:'D',reason:'消費借貸的成立須有借貸合意及金錢交付。提款只能作為間接證據；本題設定綜合證據仍不足以證明交付，應由原告承擔不利益。',sources:['loan','procedure']},
{title:'「我早就還了！」',tag:'清償・真偽不明',p:'他借的8萬元已到期，還沒有還。',d:'借款、收款、到期都承認，但我上週現金還清了。',base:'兩造對借款成立及到期均無爭執。唯一爭執為被告所稱現金還款。',issues:['借款是否因清償而消滅','原先有沒有借貸合意','原告有沒有催討'],facts:[fact('被告已返還本件8萬元','U','D','被告沒有收據；所傳證人只聽被告事後轉述。調查後仍不能確認清償。'),fact('原告沒有再次寄發催告','T','D','確實沒有再次催告；本件債務已到期，不因未再催告而消滅。'),fact('原告原先交付過借款','T','P','被告於言詞辯論明確承認原先收到借款。')],burden:'D',winner:'P',reason:'借款成立與到期既無爭執，主張債務因清償消滅的被告，應證明清償。清償仍不明時，被告承擔不利益。',sources:['pay','procedure']},
{title:'收據終於找到了',tag:'清償・證據充分',p:'3萬元借款已到期，我要求返還。',d:'我已還清，而且留有你簽的收據。',base:'借款成立、到期不爭執。僅爭執是否已清償；不涉及其他欠款。',issues:['本件借款是否已清償','雙方是否曾有借貸合意','被告是否仍保管借據'],facts:[fact('被告已清償本件3萬元','T','D','收據明載本件借款已全數清償；原告承認簽名，銀行入帳與日期金額相符，無反證。'),fact('原告仍持有原來的借據','T','P','原告保留借據，但有可信的清償收據及入帳資料。'),fact('雙方曾成立借款契約','T','P','雙方承認原先借款，不能因此排除日後已還款。')],burden:'D',winner:'D',reason:'被告就清償負舉證責任，但不代表被告必然敗訴。本題清償已獲證明，債務消滅；原告仍持有借據，不會推翻全部證據的判斷。',sources:['pay','civil']},

peer.on("error",e=>{const t=e?.type||"network";showFailure(t==="unavailable-id"?"這個房號已被使用，請重新建立房間。":t==="peer-unavailable"?"找不到房間，請確認房主仍在線上及房號正確。":"連線服務發生問題（"+t+"）。請改用另一網路再試。");});
peer.on("disconnected",()=>{if(!conn?.open && phase!=="home")showFailure("與連線協調服務中斷，請重新進入房間。");});
peer.on("open",()=>{
if(hosting){renderLobby();peer.on("connection",incoming=>{if(conn&&conn.open || (phase!=="lobby"&&phase!=="connecting")){incoming.on("open",()=>incoming.close());return;}attach(incoming);});}
else{phase="connecting";caption.textContent="正在尋找房主…";screen.innerHTML=`${title()}<h2>加入房間 ${safe(code)}</h2><p>正在與房主建立連線…</p><p class="tiny">若手機行動網路阻擋點對點連線，可能無法配對。</p>`;attach(peer.connect("faciang-court-duel-"+code,{reliable:true}));}
});
}catch(e){showFailure("初始化連線失敗，請重新整理再試。");}
}
function attach(c){
conn=c;
c.on("open",()=>{connected=true;if(role==="guest")send({type:"hello",name:nick});else {caption.textContent="對手已連線，正在確認暱稱…";}});
c.on("data",receive);
c.on("close",()=>{connected=false;if(phase!=="finished"&&phase!=="home")showFailure("對手離線了，對戰已中斷。");});
c.on("error",()=>{if(phase!=="finished")showFailure("與對手之間的連線發生錯誤。");});
}
function receive(data){
if(!data || typeof data!=="object"||typeof data.type!=="string")return;
if(role==="host"){
if(data.type==="hello"&&phase==="lobby"){rival=String(data.name||"挑戰者").slice(0,12);lobbyReady={host:false,guest:false};send({type:"welcome",host:nick,guest:rival,room});renderLobby();}
else if(data.type==="lobbyReady"&&phase==="lobby"){lobbyReady.guest=!!data.ready;send({type:"lobbyState",ready:lobbyReady});renderLobby();}
else if(data.type==="caseReady"&&["reading","review"].includes(phase)&&match&&data.caseNo===match.caseNo){match.ready.guest=true;checkCaseReady();renderCaseReady();}
else if(data.type==="answer"&&phase==="question"&&match&&data.sid===match.sid&&data.caseNo===match.caseNo&&data.step===match.step&&match.answers.guest===undefined){let ok=match.step===2?["P","D","N"].includes(data.choice)||data.choice===null:[0,1,2].includes(data.choice)||data.choice===null;if(!ok)return;match.answers.guest={value:data.choice,elapsed:Math.min(LIMIT,Math.max(0,Number(data.elapsed)||0))};maybeConclude();}
}else{
if(data.type==="welcome"&&(phase==="connecting"||phase==="home")){rival=String(data.host||"房主").slice(0,12);phase="lobby";renderLobby();}
else if(data.type==="lobbyState"&&phase==="lobby"){lobbyReady={host:!!data.ready.host,guest:!!data.ready.guest};renderLobby();}
else if(data.type==="start"&&phase==="lobby"&&Array.isArray(data.deck)&&data.deck.length===ROUND&&new Set(data.deck).size===ROUND&&data.deck.every(i=>Number.isInteger(i)&&i>=0&&i<CASES.length)){startMatch(data.deck);}
else if(data.type==="question"&&match&&["reading","question","feedback"].includes(phase)&&data.caseNo===match.caseNo&&Number.isInteger(data.step)&&data.step>=0&&data.step<3&&Array.isArray(data.order)&&data.order.length===3){launchUI(data);}
else if(data.type==="result"&&phase==="question"&&match&&data.sid===match.sid){applyResult(data);}
else if(data.type==="review"&&match&&data.caseNo===match.caseNo){showReview();}
else if(data.type==="nextCase"&&match&&data.caseNo===match.caseNo+1&&data.caseNo<ROUND){match.caseNo=data.caseNo;match.picks={host:[null,null,null],guest:[null,null,null]};showCase();}
else if(data.type==="finish"&&match){showFinish();}
}
}
function renderLobby(){
if(!room)return;
phase="lobby";caption.textContent=connected&&rival?"兩位法官已就座，準備開庭。":"等另一位玩家加入房間。";
screen.innerHTML=`${title()}<h2>${role==="host"?"房間已建立":"已加入房間"}</h2><div class="battle-panel"><p class="tiny">房號</p><div class="room-code">${safe(room)}</div><div class="buttons"><button class="secondary" id="share">複製邀請連結</button><button class="secondary" id="copy-code">複製房號</button></div><div class="battle-roster"><span>👩‍⚖️ 房主：${safe(nameOf("host"))} ${lobbyReady.host?"✅":"⏳"}</span><span>⚖️ 挑戰者：${rival?safe(nameOf("guest")):"等待加入…"} ${lobbyReady.guest?"✅":"⏳"}</span></div><div class="buttons"><button id="ready" class="secondary" ${!rival?"disabled":""}>${lobbyReady[role]?"取消準備":"我準備好了"}</button>${role==="host"&&lobbyReady.host&&lobbyReady.guest?'<button class="primary" id="begin-match">開始對戰 →</button>':""}</div><p class="tiny">兩人準備完成後由房主開庭。每局 6 案 × 3 題，共 18 次作答，滿分 60 分。</p></div>`;
$("#share").onclick=()=>copy(roomLink());$("#copy-code").onclick=()=>copy(room);
$("#ready").onclick=()=>{lobbyReady[role]=!lobbyReady[role];if(role==="guest"){send({type:"lobbyReady",ready:lobbyReady.guest});}else send({type:"lobbyState",ready:lobbyReady});renderLobby();};
if($("#begin-match"))$("#begin-match").onclick=()=>{
const deck=shuffle(CASES.map((_,i)=>i)).slice(0,ROUND);send({type:"start",deck});startMatch(deck);
};
updateCanvas();
}
async function copy(s){try{await navigator.clipboard.writeText(s);const b=$("#share");if(b)b.textContent="✓ 已複製";}catch{window.prompt("複製下面的文字：",s);}}
function startMatch(deck){
cleanupTimers();match={deck,caseNo:0,step:0,sid:0,ready:{host:false,guest:false},answers:{},picks:{host:[null,null,null],guest:[null,null,null]},scores:{host:0,guest:0},correct:{host:0,guest:0},speed:{host:0,guest:0}};
showCase();
}
function caseData(){return CASES[match.deck[match.caseNo]];}
function caseHead(c){return `<div class="casehead"><div><div class="eyebrow">CASE ${String(match.caseNo+1).padStart(2,"0")} / ${ROUND} · ${safe(c.tag)}</div><h2>${safe(c.title)}</h2></div><div class="badge">雙人對戰</div></div><div class="testimony"><div class="speech plaintiff"><label>原告</label><p>${safe(c.p)}</p></div><div class="speech"><label>被告</label><p>${safe(c.d)}</p></div></div><details class="case-premise"><summary>本案前提（請先閱讀）</summary><div class="base">${safe(c.base)}</div></details>`;}
function showCase(){
cleanupTimers();phase="reading";lock=false;match.ready={host:false,guest:false};
stageCount.textContent=`CASE ${match.caseNo+1} / 6`;
const c=caseData();caption.textContent="法官們，先確認雙方說法及本案前提，再開始計時。";
screen.innerHTML=`${scoreboard()}${caseHead(c)}<div class="battle-panel"><h3>先讀案情，準備好再開始</h3><p>兩人都按下準備後，會同時進入第一題；之後每題限時 7 秒，不中途暫停。</p><button class="primary" id="case-ready">已閱讀，開始作答</button><p class="tiny" id="ready-text">等待雙方閱讀案情…</p></div>`;$("#case-ready").onclick=pressCaseReady;updateCanvas();
}
function renderCaseReady(){const b=$("#case-ready"),t=$("#ready-text");if(b){b.disabled=!!match.ready[role];b.textContent=match.ready[role]?"已準備 ✓":"已閱讀，開始作答";}if(t)t.textContent=`自己 ${match.ready[role]?"✅":"⏳"} · 對手 ${match.ready[otherSide()]?"✅":"⏳"}`;}
function pressCaseReady(){if(!["reading","review"].includes(phase)||match.ready[role])return;match.ready[role]=true;const was=phase;renderCaseReady();if(role==="guest"){send({type:"caseReady",caseNo:match.caseNo});}else checkCaseReady();}
function checkCaseReady(){if(role!=="host"||!match.ready.host||!match.ready.guest)return;if(phase==="reading")launch(0);else if(phase==="review"){if(match.caseNo+1<ROUND){match.caseNo++;match.picks={host:[null,null,null],guest:[null,null,null]};send({type:"nextCase",caseNo:match.caseNo});showCase();}else{send({type:"finish"});showFinish();}}}
function launch(step){
if(role!=="host"||!match)return;
const order=shuffle([0,1,2]);match.sid++;const packet={type:"question",caseNo:match.caseNo,step,order,sid:match.sid};
send(packet);launchUI(packet);
}
function questionItems(c,step){return step===0?c.issues:step===1?c.facts.map(x=>x.text):[labels.P,labels.D,labels.N];}
function optionsValue(step,i){return step===2?["P","D","N"][i]:i;}
function launchUI(packet){
cleanupTimers();phase="question";lock=false;match.step=packet.step;match.sid=packet.sid;match.answers={};match.order=packet.order;
const c=caseData(),choices=questionItems(c,packet.step);
const opts=packet.order.map((idx,position)=>`<button class="option" data-val="${safe(optionsValue(packet.step,idx))}"><span class="key">${position+1}</span><span>${safe(choices[idx])}</span></button>`).join("");
const stepBar=steps.map((s,i)=>`<div class="step ${i===packet.step?"active":i<packet.step?"done":""}">${i+1}. ${s}</div>`).join("");
screen.innerHTML=`${scoreboard()}${caseHead(c)}<div class="steps">${stepBar}</div><div class="questionhead"><h2>${steps[packet.step]}</h2><div class="timer" id="timer">7.0</div></div><div class="track"><div class="fill" id="time-fill" style="width:100%"></div></div><div class="options">${opts}</div><p class="tiny" id="answer-note">兩人各自選擇；答題後等待對手，不能更改。</p>`;
for(const btn of screen.querySelectorAll("[data-val]"))btn.onclick=()=>submit(packet.step===2?btn.dataset.val:Number(btn.dataset.val));
localStart=performance.now();
const sid=packet.sid;
clockInterval=setInterval(()=>{if(phase!=="question"||match.sid!==sid){clearInterval(clockInterval);return;}const left=Math.max(0,LIMIT-(performance.now()-localStart));const t=$("#timer"),f=$("#time-fill");if(t){t.textContent=(left/1000).toFixed(1);t.classList.toggle("urgent",left<2000);}if(f)f.style.width=(left/LIMIT*100)+"%";},60);
clockTimeout=setTimeout(()=>submit(null),LIMIT);
if(role==="host"){hostFallback=setTimeout(()=>{if(phase==="question"&&match.sid===sid){if(match.answers.host===undefined)match.answers.host={value:null,elapsed:LIMIT};if(match.answers.guest===undefined)match.answers.guest={value:null,elapsed:LIMIT};conclude();}},LIMIT+850);}
caption.textContent=`第 ${match.caseNo+1} 案 · ${steps[packet.step]} · 7 秒內作答`;
}
function submit(value){
if(lock||phase!=="question")return;lock=true;clearTimeout(clockTimeout);
const elapsed=Math.min(LIMIT,Math.max(0,Math.round(performance.now()-localStart)));
screen.querySelectorAll(".option").forEach(b=>{b.disabled=true;if(String(b.dataset.val)===String(value))b.classList.add("selected");});
const note=$("#answer-note");if(note)note.textContent=value===null?"時間到！等待對手…":"已送出答案，等待對手…";
const answer={value,elapsed};
if(role==="host"){match.answers.host=answer;maybeConclude();}else send({type:"answer",sid:match.sid,caseNo:match.caseNo,step:match.step,choice:value,elapsed});
}
function maybeConclude(){if(role==="host"&&match.answers.host!==undefined&&match.answers.guest!==undefined)conclude();}
function correctValue(c,step){return step<2?0:c.burden;}
function conclude(){
if(role!=="host"||phase!=="question"||match.answers.host===undefined||match.answers.guest===undefined)return;
const c=caseData(),s=match.step,ans=match.answers,correct=correctValue(c,s);
for(const side of ["host","guest"]){
const val=ans[side].value;
match.picks[side][s]=val;
if(val===correct){match.correct[side]++;match.scores[side]+=weights[s];match.speed[side]+=ans[side].elapsed;}
}
const payload={type:"result",sid:match.sid,caseNo:match.caseNo,step:s,answers:{host:ans.host.value,guest:ans.guest.value},correct,scores:{...match.scores},hits:{...match.correct},speed:{...match.speed}};
send(payload);applyResult(payload);
nextDelay=setTimeout(()=>{if(phase!=="feedback"||match.step!==s)return;if(s<2)launch(s+1);else {send({type:"review",caseNo:match.caseNo});showReview();}},1800);
}
function applyResult(d){
cleanupTimers();phase="feedback";
match.scores={host:Math.max(0,Number(d.scores.host)||0),guest:Math.max(0,Number(d.scores.guest)||0)};
match.correct={host:Math.max(0,Number(d.hits.host)||0),guest:Math.max(0,Number(d.hits.guest)||0)};
match.speed={host:Number(d.speed.host)||0,guest:Number(d.speed.guest)||0};
for(const side of ["host","guest"])match.picks[side][match.step]=d.answers[side];
const c=caseData(),items=questionItems(c,match.step);
const correctText=match.step===2?labels[d.correct]:items[d.correct];
const you=d.answers[role],them=d.answers[otherSide()],fmt=v=>v===null?"逾時未答":match.step===2?labels[v]:items[v];
screen.innerHTML=`${scoreboard()}${caseHead(c)}<div class="battle-panel"><div class="eyebrow">第 ${match.step+1} / 3 題 · 即時判定</div><h2>${you===d.correct?"✓ 答對了！":"✕ 這題沒有答對"}</h2><p><b>正確答案：</b>${safe(correctText)}</p><div class="battle-answers"><p><b>你：</b>${safe(fmt(you))} ${you===d.correct?"✅":"❌"}</p><p><b>對手：</b>${safe(fmt(them))} ${them===d.correct?"✅":"❌"}</p></div><p class="tiny">即將進入${match.step<2?"下一道問題":"本案解析"}…</p></div>`;
caption.textContent="雙方作答完成，已更新計分。";
}
function showReview(){
cleanupTimers();phase="review";const c=caseData();
caption.textContent="本案解析 · 兩人讀完後一起進入下一案。";
screen.innerHTML=`${scoreboard()}${caseHead(c)}<div class="battle-panel"><div class="eyebrow">本案解析 · CASE ${match.caseNo+1}</div><h3>正確判斷</h3><p><b>主要爭點：</b>${safe(c.issues[0])}</p><p><b>關鍵事實：</b>${safe(c.facts[0].text)}</p><p><b>舉證責任：</b>${safe(labels[c.burden])}</p><div class="base"><b>固定卷證：</b>${safe(c.facts[0].evidence)}</div><h3 style="margin-top:18px">法院判斷</h3><p>${safe(c.reason)}</p><p><strong class="gold">本案結論：${safe(labels[c.winner])}勝訴</strong></p>${c.sources.map(k=>SOURCES[k]?`<a class="source" href="${safe(SOURCES[k].url)}" target="_blank" rel="noopener">↗ ${safe(SOURCES[k].name)}</a>`:"").join("")}<div class="buttons"><button class="primary" id="case-ready">${match.caseNo===ROUND-1?"我看完了，查看總成績":"我看完了，下一案"}</button></div><p class="tiny" id="ready-text">雙方完成閱讀後，才會進入下一案。</p></div>`;match.ready={host:false,guest:false};$("#case-ready").onclick=pressCaseReady;updateCanvas();
}
function showFinish(){
cleanupTimers();phase="finished";stageCount.textContent="COURT ADJOURNED";caption.textContent="今日法庭雙人對決結束。";
let winning;
if(match.correct.host!==match.correct.guest)winning=match.correct.host>match.correct.guest?"host":"guest";
else if(match.scores.host!==match.scores.guest)winning=match.scores.host>match.scores.guest?"host":"guest";
else if(match.speed.host!==match.speed.guest)winning=match.speed.host<match.speed.guest?"host":"guest";
else winning="draw";
const status=winning==="draw"?"雙方平手！":winning===role?"你贏了！":"對手獲勝！";
screen.innerHTML=`${title()}<h1>${status}</h1>${scoreboard()}<div class="battle-panel"><h2>最終對戰成績</h2><p>房主 ${safe(nameOf("host"))}：<b>${match.correct.host} 題正確</b>，${match.scores.host} 分</p><p>挑戰者 ${safe(nameOf("guest"))}：<b>${match.correct.guest} 題正確</b>，${match.scores.guest} 分</p><p class="tiny">排名先比較答對數（18 次作答），同分再比較加權總分（滿分60分），最後比較正確選項的作答總時間。全部相同則平手。</p><div class="buttons"><button class="primary" id="again">重新開房再戰</button><a class="secondary b-link" href="../">返回單人版</a></div></div>`;$("#again").onclick=()=>location.assign(location.pathname);updateCanvas();
}
document.addEventListener("keydown",e=>{if(phase!=="question"||lock||e.repeat)return;const n=Number(e.key);if(n<1||n>3)return;const b=screen.querySelectorAll(".option")[n-1];if(b){e.preventDefault();b.click();}});
showHome();
})();</script>
</body></html>

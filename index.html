<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好法遊戲區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16141f;
    --ink-2:#1f1c2b;
    --ink-3:#282540;
    --paper:#f4f0e6;
    --muted:#9a93b8;
    --line:rgba(255,255,255,.09);
    --amber:#ffc94d;
    --amber-deep:#ff9f1c;
    --radius:16px;
    --sans:"Noto Sans TC",system-ui,sans-serif;
    --mono:"Space Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(1200px 600px at 50% -240px, rgba(255,201,77,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 120%, rgba(155,93,229,.08), transparent 55%);
    color:var(--paper);
    font-family:var(--sans);
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(16px,4vw,28px) 72px}

  /* ---------- 街機招牌 marquee ---------- */
  .marquee{
    position:relative;
    border:1px solid var(--line);
    border-radius:22px;
    background:linear-gradient(180deg,var(--ink-2),var(--ink));
    padding:clamp(26px,5vw,44px) clamp(20px,4vw,40px);
    text-align:center;
    overflow:hidden;
  }
  .marquee::before,.marquee::after{
    content:"";position:absolute;left:14px;right:14px;height:10px;
    background:radial-gradient(circle at 6px 5px, var(--amber) 0 2.6px, transparent 3px);
    background-size:22px 10px;background-repeat:repeat-x;
    opacity:.85;filter:drop-shadow(0 0 4px rgba(255,201,77,.6));
    animation:blink 1.8s steps(2) infinite;
  }
  .marquee::before{top:12px}
  .marquee::after{bottom:12px}
  @keyframes blink{50%{opacity:.35}}
  .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.28em;
    color:var(--amber);text-transform:uppercase;margin:0 0 10px;
  }
  .title{
    margin:0;
    font-weight:900;
    font-size:clamp(38px,9vw,74px);
    letter-spacing:.04em;
    line-height:1;
    color:var(--paper);
    text-shadow:0 0 18px rgba(255,201,77,.35),0 3px 0 rgba(0,0,0,.4);
  }
  .tagline{margin:14px auto 0;max-width:36ch;color:var(--muted);font-size:15px}
  .marquee-link{
    display:inline-flex;align-items:center;gap:7px;margin-top:18px;
    font-family:var(--mono);font-size:13px;text-decoration:none;font-weight:700;
    color:#20180a;background:var(--amber);padding:9px 17px;border-radius:999px;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .marquee-link:hover{transform:translateY(-2px);box-shadow:0 8px 22px -8px rgba(255,201,77,.7)}
  .marquee-link:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

  /* ---------- 控制列 ---------- */
  .bar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin:26px 0 14px;
  }
  .search{
    flex:1 1 240px;position:relative;min-width:0;
  }
  .search input{
    width:100%;padding:12px 14px 12px 40px;
    background:var(--ink-2);border:1px solid var(--line);border-radius:12px;
    color:var(--paper);font-family:var(--sans);font-size:15px;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus-visible{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
  .count{
    font-family:var(--mono);font-size:13px;color:var(--muted);
    background:var(--ink-2);border:1px solid var(--line);
    padding:9px 13px;border-radius:12px;white-space:nowrap;
  }
  .count b{color:var(--amber)}
  .sort{display:flex;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:3px}
  .sort button{
    border:0;background:transparent;color:var(--muted);cursor:pointer;
    font-family:var(--sans);font-size:13px;padding:7px 12px;border-radius:9px;
  }
  .sort button[aria-pressed="true"]{background:var(--amber);color:#20180a;font-weight:700}
  .sort button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---------- 標籤 chips ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
  .chip{
    border:1px solid var(--line);background:var(--ink-2);color:var(--muted);
    font-family:var(--sans);font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;
  }
  .chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:rgba(255,201,77,.10)}
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---------- 卡帶 grid ---------- */
  .grid{
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  }
  .card{
    position:relative;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
    animation:pop .4s both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card:hover,.card:focus-within{
    transform:translateY(-4px);
    border-color:color-mix(in srgb,var(--c) 60%,transparent);
    box-shadow:0 14px 30px -12px color-mix(in srgb,var(--c) 55%,transparent);
  }
  .card__art{
    height:118px;display:flex;align-items:center;justify-content:center;
    font-size:52px;line-height:1;
    background:
      radial-gradient(120% 120% at 20% 0%, color-mix(in srgb,var(--c) 42%,transparent), transparent 60%),
      color-mix(in srgb,var(--c) 16%,var(--ink-3));
    border-bottom:1px solid var(--line);
  }
  .card__art span{filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));transition:transform .2s ease}
  .card:hover .card__art span{transform:scale(1.12) rotate(-4deg)}
  .card__body{padding:14px 15px 16px}
  .card__name{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em}
  .card__link::after{content:"";position:absolute;inset:0}
  .card__link{color:inherit;text-decoration:none}
  .card__desc{margin:6px 0 0;font-size:13.5px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card__meta{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .card__date{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .card__tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .card__tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
  .badge{
    position:absolute;top:10px;right:10px;z-index:2;
    font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.14em;
    background:var(--amber);color:#20180a;padding:3px 8px;border-radius:7px;
    box-shadow:0 0 0 3px rgba(255,201,77,.18);
  }
  .threads{
    position:relative;z-index:3;display:inline-flex;align-items:center;gap:4px;
    font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;
    border:1px solid var(--line);padding:3px 9px;border-radius:999px;
  }
  .threads:hover{color:var(--paper);border-color:var(--muted)}
  .card:focus-within{outline:none}
  .card__link:focus-visible::after{outline:2px solid var(--amber);outline-offset:-2px;border-radius:var(--radius)}

  /* ---------- 空狀態 ---------- */
  .empty{
    grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--muted);
    border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty p{margin:0 0 14px;font-size:15px}
  .empty button{
    background:var(--amber);color:#20180a;border:0;font-weight:700;font-family:var(--sans);
    padding:9px 18px;border-radius:10px;cursor:pointer;
  }

  /* ---------- 早期 homepage 風瀏覽計數器 ---------- */
  .retro-counter{
    width:max-content;max-width:100%;margin:38px auto 0;padding:8px 11px;
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
    border:2px ridge #8f8f8f;background:#050505;color:#79ff69;
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;
    box-shadow:inset 0 0 0 1px #000,0 0 12px rgba(121,255,105,.10);
    text-shadow:0 0 5px rgba(121,255,105,.55);
  }
  .retro-counter img{display:block;height:20px;max-width:100%;image-rendering:pixelated}
  .retro-counter__star{color:#ffef63}
  .retro-counter__blink{color:#ffef63;animation:retroBlink 1.05s steps(2) infinite}
  @keyframes retroBlink{50%{opacity:.22}}
  .retro-counter__since{color:#7d7d7d;font-size:9px;letter-spacing:.04em}


  /* 玩家留言板 */
  .guestbook{margin:26px 0 30px;padding:22px;border:1px solid rgba(255,201,77,.32);border-radius:18px;background:var(--ink-2)}
  .guestbook h2{margin:0;color:var(--amber);font-size:22px}
  .guestbook__sub{margin:3px 0 16px;color:var(--muted);font-size:13px}
  .guestbook__form{display:grid;gap:10px}
  .guestbook input,.guestbook textarea{width:100%;min-width:0;padding:11px 13px;background:var(--ink);border:1px solid rgba(255,255,255,.2);border-radius:10px;color:var(--paper);font:16px var(--sans)}
  .guestbook textarea{min-height:95px;resize:vertical}
  .guestbook button{border:1px solid var(--line);border-radius:10px;padding:10px 15px;background:var(--amber);color:#20180a;font:700 14px var(--sans);cursor:pointer}
  .guestbook button:disabled{opacity:.55;cursor:not-allowed}
  .guestbook button:focus-visible,.guestbook input:focus-visible,.guestbook textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .guestbook__tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
  .guestbook__tools small{color:var(--muted)}
  .guestbook__status{color:var(--muted);font-size:13px;min-height:22px}
  .guestbook__list{margin-top:17px;display:grid;gap:10px}
  .guestbook__entry{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 15px;overflow-wrap:anywhere}
  .guestbook__entry header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .guestbook__entry strong{color:var(--amber)}
  .guestbook__entry time{font:11px var(--mono);color:var(--muted)}
  .guestbook__entry p{white-space:pre-wrap;margin:9px 0 0;font-size:14px}
  .guestbook__entry .guestbook__delete{background:transparent;color:#ff9797;border-color:#ff9797;padding:5px 9px}
  .guestbook__admin{margin-top:16px;font-size:12px;color:var(--muted)}
  .guestbook__admin button{background:transparent;color:var(--amber);padding:6px 10px}
  .guestbook__uid{overflow-wrap:anywhere}
  @media(max-width:480px){.guestbook{padding:16px}}

  footer{margin-top:18px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px}
  footer a{color:var(--amber);text-decoration:none}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="marquee">
      <p class="eyebrow">▸ Insert Coin · Select a Game</p>
      <h1 class="title">好法遊戲區</h1>
      <!-- 改這行成你自己的介紹 -->
      <p class="tagline">把我丟在 Threads 上的小遊戲全收在這，隨時回來玩。</p>
      <a class="marquee-link" href="https://www.threads.com/@faciang5566" target="_blank" rel="noopener">＠faciang5566 · 追蹤我的 Threads ↗</a>
    </header>


    <section class="guestbook" aria-labelledby="guestbook-title">
      <h2 id="guestbook-title">✦ 玩家留言板 <span aria-hidden="true">💬</span></h2>
      <p class="guestbook__sub">GUESTBOOK · 玩完遊戲，留個言吧！不必註冊帳號。</p>
      <form id="guestbook-form" class="guestbook__form">
        <label for="guestbook-name">玩家暱稱</label>
        <input id="guestbook-name" name="name" maxlength="20" required placeholder="例如：路過的民法戰士" autocomplete="nickname">
        <label for="guestbook-message">留言內容</label>
        <textarea id="guestbook-message" name="message" maxlength="300" required placeholder="分享心得、回報問題，或單純打個招呼…"></textarea>
        <div class="guestbook__tools"><small>最多 300 字 · 請勿留下個人資料</small><button id="guestbook-submit" type="submit" disabled>連線中…</button></div>
        <div id="guestbook-status" class="guestbook__status" role="status" aria-live="polite">正在連接留言板…</div>
      </form>
      <div id="guestbook-list" class="guestbook__list" aria-live="polite"></div>
      <div class="guestbook__tools" style="margin-top:12px"><small id="guestbook-count"></small><button id="guestbook-more" type="button" hidden>載入更多留言 ↓</button></div>
      <div class="guestbook__admin">
        <button type="button" id="guestbook-login">管理員 Google 登入</button>
        <button type="button" id="guestbook-logout" hidden>登出管理員</button>
        <span id="guestbook-admin-status" class="guestbook__uid"></span>
      </div>
    </section>

    <div class="bar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="搜尋遊戲名稱、標籤…" aria-label="搜尋遊戲">
      </div>
      <div class="sort" role="group" aria-label="排序方式">
        <button data-sort="new" aria-pressed="true">最新</button>
        <button data-sort="old" aria-pressed="false">最舊</button>
        <button data-sort="name" aria-pressed="false">名稱</button>
      </div>
      <div class="count">共 <b id="count">0</b> 款</div>
    </div>

    <div class="chips" id="chips" role="group" aria-label="標籤篩選"></div>

    <section class="grid" id="grid" aria-live="polite"></section>

    <div class="retro-counter" title="復古 hit counter：每次載入首頁都可能增加一次">
      <span class="retro-counter__star">★</span>
      <span>YOU ARE VISITOR</span>
      <img src="https://api.visitorbadge.io/api/VisitorHit?user=faciang&repo=Game-index-page&label=No.&labelColor=%23111111&countColor=%23111111" alt="首頁瀏覽次數">
      <span class="retro-counter__blink">THANKS!</span>
      <span class="retro-counter__since">SINCE 2026</span>
    </div>
    <footer>好法遊戲區 · made with ♥ on GitHub Pages</footer>
  </main>

<script>
/* ================================================================
   ⬇⬇⬇  你只要改這裡：每做一個新遊戲，就在最上面加一筆  ⬇⬇⬇
   欄位說明：
     title   遊戲名稱（必填）
     emoji   卡帶上的圖示，任何 emoji 都行（必填）
     desc    一句話介紹
     date    發布日期 "YYYY-MM-DD"，用來排序，最新的會亮 NEW
     tags    分類標籤陣列，可留空 []
     url     遊戲網址，相對路徑（games/xxx.html）或完整網址都可
     threads 對應的 Threads 貼文網址，可省略
     color   想指定卡帶顏色再加這欄（如 "#ff6b6b"），不填會自動配色
   ================================================================ */
const GAMES = [
  { title:"憲法放課後", emoji:"🐕", desc:"和學長、學姐、校狗或校貓一起讀憲法，在校園互動與小測驗中完成第一章。", date:"2026-09-14", tags:["憲法","教學","劇情"], url:"games/constitution-afterclass/", threads:"" },

  { title:"卷與巴掌", emoji:"🗃️", desc:"在卷宗與巴掌之間展開荒謬的司法小遊戲。", date:"2026-08-29", tags:["動作","法院","惡搞"], url:"https://faciang.github.io/Slap/", threads:"" },
  { title:"微驚悚無因管理小遊戲", emoji:"🌧️", desc:"在暴雨夜的租屋處，從一連串異常事件中理解無因管理。", date:"2026-08-24", tags:["劇情","民法","驚悚"], url:"https://faciang.github.io/just-helping/", threads:"" },
  { title:"小朋友的第一本民法 電子書", emoji:"📚", desc:"用簡單圖文帶小朋友認識民法的基本概念。", date:"2026-08-20", tags:["電子書","民法","兒童"], url:"https://faciang.github.io/civil-law-for-kids/", threads:"" },
  { title:"正當防衛小遊戲", emoji:"🛡️", desc:"在互動情境中判斷何時可以主張正當防衛。", date:"2026-08-15", tags:["教學","刑法","互動"], url:"https://faciang.github.io/Defend-game/", threads:"" },
  { title:"法律怪物小擂台", emoji:"👾", desc:"收集法律怪物，派出你的怪物上場對戰。", date:"2026-08-10", tags:["對戰","收集","法律"], url:"https://faciang.github.io/legal-monster-arena/", threads:"" },

  { title:"性向測驗遊戲", emoji:"🧠", desc:"回答幾個問題，看看你是哪一種法律系人格。", date:"2026-08-04", tags:["測驗","性向","法律"], url:"https://faciang.github.io/mind-game/", threads:"" },
  { title:"本票案件小遊戲", emoji:"🧾", desc:"化身菜鳥律師處理本票案件，在法庭攻防中判斷原因關係、舉證責任與上訴答辯。", date:"2026-07-28", tags:["模擬","民事","律師"], url:"https://faciang.github.io/Lawyer-game-/", threads:"" },
  { title:"書記官編頁小遊戲", emoji:"📑", desc:"化身法院書記官，在各種突發狀況中完成卷宗編頁工作。", date:"2026-07-27", tags:["節奏","法院","書記官"], url:"https://faciang.github.io/page-game/", threads:"" },

  { title:"工作損失與勞動力減損計算器", emoji:"🧮", desc:"計算不能工作損失與勞動能力減損金額，並以霍夫曼方式扣除中間利息。", date:"2026-07-19", tags:["計算器","民事","求償"], url:"https://faciang.github.io/Hofman/", threads:"" },

  { title:"法庭格鬥 Court-Fighter", emoji:"🥊", desc:"把法庭變擂台，律師互毆的荒謬格鬥遊戲。", date:"2026-06-20", tags:["格鬥","動作"], url:"https://faciang.github.io/court-fighter/", threads:"" },
];
/* ⬆⬆⬆  上面加完存檔、推上 GitHub 就好，其他都自動  ⬆⬆⬆ */

const PALETTE = ["#ff6b6b","#22b8a6","#9b5de5","#4cc9f0","#9bd831","#ff70a6","#ff9e3d","#5c8dff"];
const hueFor = s => PALETTE[[...s].reduce((a,c)=>a+c.charCodeAt(0),0) % PALETTE.length];

// 找出最新日期，用來標記 NEW
const newest = GAMES.reduce((m,g)=> g.date > m ? g.date : m, "");

const state = { q:"", tag:"all", sort:"new" };
const $ = s => document.querySelector(s);
const grid = $("#grid"), chips = $("#chips"), countEl = $("#count");
const esc = s => (s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 建立標籤列
const allTags = [...new Set(GAMES.flatMap(g => g.tags || []))].sort();
chips.innerHTML = ['<button class="chip" data-tag="all" aria-pressed="true">全部</button>']
  .concat(allTags.map(t => `<button class="chip" data-tag="${esc(t)}" aria-pressed="false">${esc(t)}</button>`))
  .join("");

function sortGames(list){
  const by = {
    new:  (a,b) => (b.date||"").localeCompare(a.date||""),
    old:  (a,b) => (a.date||"").localeCompare(b.date||""),
    name: (a,b) => a.title.localeCompare(b.title,"zh-Hant"),
  }[state.sort];
  return [...list].sort(by);
}

function render(){
  const q = state.q.trim().toLowerCase();
  let list = GAMES.filter(g => {
    const tagOk = state.tag === "all" || (g.tags||[]).includes(state.tag);
    const hay = (g.title + " " + (g.desc||"") + " " + (g.tags||[]).join(" ")).toLowerCase();
    return tagOk && (!q || hay.includes(q));
  });
  list = sortGames(list);
  countEl.textContent = list.length;

  if(!list.length){
    grid.innerHTML = `<div class="empty"><p>找不到符合的遊戲 — 換個關鍵字試試？</p><button id="reset">清除篩選</button></div>`;
    $("#reset").onclick = () => { state.q=""; state.tag="all"; $("#search").value="";
      document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.tag==="all"));
      render(); };
    return;
  }

  grid.innerHTML = list.map((g,i) => {
    const c = g.color || hueFor(g.title);
    const isNew = g.date && g.date === newest;
    const tags = (g.tags||[]).map(t => `<span class="card__tag">${esc(t)}</span>`).join("");
    const threads = g.threads ? `<a class="threads" href="${esc(g.threads)}" target="_blank" rel="noopener">Threads ↗</a>` : "";
    const href = g.url ? esc(g.url) : "#";
    return `<article class="card" style="--c:${c};animation-delay:${i*35}ms">
      ${isNew ? '<span class="badge">NEW</span>' : ''}
      <div class="card__art"><span>${esc(g.emoji||"🎮")}</span></div>
      <div class="card__body">
        <h2 class="card__name"><a class="card__link" href="${href}">${esc(g.title)}</a></h2>
        ${g.desc ? `<p class="card__desc">${esc(g.desc)}</p>` : ""}
        <div class="card__meta">
          <span class="card__date">${esc(g.date||"")}</span>
          ${threads}
          <div class="card__tags">${tags}</div>
        </div>
      </div>
    </article>`;
  }).join("");
}

// 事件
$("#search").addEventListener("input", e => { state.q = e.target.value; render(); });
document.querySelectorAll(".sort button").forEach(b => b.addEventListener("click", () => {
  state.sort = b.dataset.sort;
  document.querySelectorAll(".sort button").forEach(x => x.setAttribute("aria-pressed", x===b));
  render();
}));
chips.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  state.tag = b.dataset.tag;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x===b));
  render();
});

render();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, signInAnonymously, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, startAfter, getDocs, addDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const app = initializeApp({
  apiKey:"AIzaSyCUtHObZC0UI4NTzhian32ZN1NcvkW6GdE",
  authDomain:"game-board-1d89e.firebaseapp.com",
  projectId:"game-board-1d89e",
  storageBucket:"game-board-1d89e.firebasestorage.app",
  messagingSenderId:"965597746571",
  appId:"1:965597746571:web:6d0db56d48c44baf620b8e",
  measurementId:"G-GRZ1RM6Q24"
});
const auth=getAuth(app), db=getFirestore(app), messages=collection(db,"messages");
const $g=id=>document.getElementById(id);
const status=$g("guestbook-status"), list=$g("guestbook-list"), submit=$g("guestbook-submit");
let last=null, more=false, busy=false, adminUid=null;
const ADMIN_UID = "vVZc5WkvFIad1yXFuz5nEr0rAml1"; // Firebase Google 管理員 UID
function note(msg){status.textContent=msg}
function dateText(v){const d=v?.toDate?.();return d?new Intl.DateTimeFormat("zh-TW",{dateStyle:"medium",timeStyle:"short"}).format(d):"剛剛"}
function entry(snapshot){
  const d=snapshot.data(), box=document.createElement("article");box.className="guestbook__entry";
  const head=document.createElement("header"), name=document.createElement("strong"), time=document.createElement("time"), body=document.createElement("p");
  name.textContent=String(d.name||"匿名玩家").slice(0,20);time.textContent=dateText(d.createdAt);
  body.textContent=String(d.message||"").slice(0,300);
  head.append(name,time);
  if(adminUid && auth.currentUser?.uid===adminUid){
    const del=document.createElement("button");del.type="button";del.className="guestbook__delete";del.textContent="刪除";
    del.addEventListener("click",async()=>{if(!confirm("確定刪除這則留言？"))return;del.disabled=true;try{await deleteDoc(doc(db,"messages",snapshot.id));box.remove()}catch(e){del.disabled=false;note("刪除失敗，請確認管理員權限規則。")}});
    head.append(del);
  }
  box.append(head,body);return box;
}
async function load(reset=false){
  if(busy)return;busy=true;
  try{
    if(reset){last=null;list.replaceChildren()}
    const parts=[orderBy("createdAt","desc"),limit(11)];
    if(last)parts.unshift(startAfter(last));
    const snap=await getDocs(query(messages,...parts));
    const docs=snap.docs.slice(0,10);if(docs.length && list.textContent==="還沒有留言，等你來搶頭香！")list.replaceChildren();docs.forEach(d=>list.append(entry(d)));
    more=snap.size>10;last=docs.at(-1)||last;
    $g("guestbook-more").hidden=!more;
    $g("guestbook-count").textContent=list.children.length+" 則留言已載入";
    if(!list.children.length)list.textContent="還沒有留言，等你來搶頭香！";
  }catch(e){note("讀取留言失敗，請檢查 Firestore 規則及網路連線。")}
  finally{busy=false}
}
$g("guestbook-more").addEventListener("click",()=>load());
$g("guestbook-form").addEventListener("submit",async e=>{
  e.preventDefault();if(busy||!auth.currentUser)return;
  const name=$g("guestbook-name").value.trim(),message=$g("guestbook-message").value.trim();
  if(!name||name.length>20||!message||message.length>300){note("請填寫暱稱（20字內）與留言（300字內）。");return}
  const prev=Number(localStorage.getItem("guestbook-last-post")||0);
  if(Date.now()-prev<60000){note("請稍候一分鐘再留言。");return}
  busy=true;submit.disabled=true;
  try{
    await addDoc(messages,{name,message,createdAt:serverTimestamp(),authorUid:auth.currentUser.uid});
    localStorage.setItem("guestbook-last-post",String(Date.now()));
    $g("guestbook-message").value="";note("留言成功！");
    busy=false;await load(true);
  }catch(err){note(err.code==="permission-denied"?"目前尚未開放留言，請等待站長完成安全規則設定。":"送出失敗，請稍後重試。")}
  finally{busy=false;submit.disabled=false}
});
const provider=new GoogleAuthProvider();
$g("guestbook-login").addEventListener("click",async()=>{
  try{await signInWithPopup(auth,provider)}
  catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){await signInWithRedirect(auth,provider)}else{note("Google 登入失敗，請確認瀏覽器允許彈出視窗及授權網域。")}}
});
$g("guestbook-logout").addEventListener("click",async()=>{await signOut(auth);await signInAnonymously(auth)});
onAuthStateChanged(auth,async user=>{
  if(!user){try{await signInAnonymously(auth)}catch(e){note("匿名登入失敗，請檢查 Authentication 設定。")}return}
  const google=!user.isAnonymous;
  adminUid=ADMIN_UID||null;
  $g("guestbook-login").hidden=google;$g("guestbook-logout").hidden=!google;
  $g("guestbook-admin-status").textContent=google?("登入 UID："+user.uid+(user.uid===ADMIN_UID?"（管理員）":"（尚未授權管理權限）")):"";
  submit.disabled=false;submit.textContent="▶ 發送留言";
  note("留言板已連線。若無法發文，請先完成 Firestore 寫入規則設定。");
  await load(true);
});
getRedirectResult(auth).catch(()=>note("登入跳轉失敗，請確認授權網域。"));
</script>
